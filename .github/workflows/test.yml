name: Run Tests

on:
  pull_request:
    branches:
      - main

jobs:
  Test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set Up Java
        uses: actions/setup-java@v3.13.0
        with:
          java-version: 17
          distribution: oracle

      - name: Set Up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: 3.8.2

      - name: Run Unit Tests
        run: |
          mvn -B test \
            -Ddiscord.bot.token=${{ secrets.DISCORD_BOT_TOKEN }} \
            -Damazon.aws.region=${{ secrets.AMAZON_AWS_REGION }} \
            -Damazon.aws.accesskey=${{ secrets.AMAZON_AWS_ACCESSKEY }} \
            -Damazon.aws.secretkey=${{ secrets.AMAZON_AWS_SECRETKEY }} \
            -Dtwitch.api.client.id=${{ secrets.TWITCH_API_CLIENT_ID }} \
            -Dtwitch.api.client.secret=${{ secrets.TWITCH_API_CLIENT_SECRET }} \
            -Dyoutube.api.key=${{ secrets.YOUTUBE_API_KEY }} \
            -Dyoutube.oauth2.refresh-token=${{ secrets.YOUTUBE_OAUTH2_REFRESH_TOKEN }}
